stages:
  - build
  - deploy

variables:
  NODE_VERSION: "20"

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - node_modules/

build:
  stage: build
  image: node:${NODE_VERSION}-alpine
  variables:
    # VITE_GITLAB_TOKEN はここで渡さない。VITE_ prefix の値はビルド時に JS へ
    # 展開されるため、配信物からトークンを読み取れてしまう。利用者はヘッダーの
    # 鍵ボタンからトークンを入力する (保存先は各自のブラウザ)。
    VITE_BASE_PATH: /application/tools/devtools/gitlab-grep/
  script:
    - npm ci
    - npm run type-check
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 hour
  rules:
    - if: $CI_COMMIT_BRANCH

pages:
  stage: deploy
  image: alpine:latest
  script:
    - mv dist public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  needs:
    - build
