<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="GitLab Grep - MR検索ツール" />
    <title>GitLab Grep</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230070f3'/%3E%3Ccircle cx='28' cy='28' r='12' stroke='white' stroke-width='4' fill='none'/%3E%3Cline x1='36' y1='36' x2='50' y2='50' stroke='white' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body>
    <script>
      (function () {
        var theme = localStorage.getItem("gitlab-grep-theme");
        if (!theme) {
          theme = window.matchMedia("(prefers-color-scheme: light)").matches
            ? "vercel-light"
            : "vercel";
        }
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
    <div id="app"></div>
    <script type="module" src="/src/client.tsx"></script>
  </body>
</html>
