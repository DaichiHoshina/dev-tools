stages:
  - lint
  - build
  - upload
  - release

variables:
  BINARY_NAME: kube-deploy
  PACKAGE_NAME: kube-deploy
  PACKAGE_REGISTRY_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${PACKAGE_NAME}/${CI_COMMIT_TAG}"

shellcheck:
  stage: lint
  image: koalaman/shellcheck-alpine:stable
  script:
    - shellcheck -x kube-deploy.sh lib/*.sh
  rules:
    - changes:
        - "*.sh"
        - "lib/*.sh"

workflow:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
    - if: $CI_PIPELINE_SOURCE == "push"

build:
  stage: build
  image: golang:1.22-alpine
  script:
    - |
      for target in "darwin arm64" "darwin amd64" "linux amd64"; do
        set -- $target
        os=$1 arch=$2
        output="${BINARY_NAME}-${os}-${arch}"
        echo "Building ${output}..."
        GOOS=$os GOARCH=$arch go build -ldflags "-s -w -X main.version=${CI_COMMIT_TAG}" -o "$output" ./cmd/kube-deploy
      done
  artifacts:
    paths:
      - kube-deploy-*
    expire_in: 1 hour
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

upload:
  stage: upload
  image: curlimages/curl:latest
  needs:
    - job: build
      artifacts: true
  script:
    - |
      for file in kube-deploy-*; do
        echo "Uploading ${file}..."
        curl --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
             --upload-file "$file" \
             "${PACKAGE_REGISTRY_URL}/${file}"
      done
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: upload
  script:
    - echo "Creating release for ${CI_COMMIT_TAG}"
  release:
    tag_name: $CI_COMMIT_TAG
    name: "Release $CI_COMMIT_TAG"
    description: "Release $CI_COMMIT_TAG"
    assets:
      links:
        - name: kube-deploy-darwin-arm64
          url: "${PACKAGE_REGISTRY_URL}/kube-deploy-darwin-arm64"
        - name: kube-deploy-darwin-amd64
          url: "${PACKAGE_REGISTRY_URL}/kube-deploy-darwin-amd64"
        - name: kube-deploy-linux-amd64
          url: "${PACKAGE_REGISTRY_URL}/kube-deploy-linux-amd64"
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
