<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Kube Lens - Kubernetes Dashboard" />
    <title>Kube Lens</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='64' y2='64'%3E%3Cstop offset='0%25' stop-color='%230070f3'/%3E%3Cstop offset='100%25' stop-color='%237928ca'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='26' cy='26' r='18' fill='none' stroke='url(%23g)' stroke-width='6'/%3E%3Cline x1='38' y1='38' x2='56' y2='56' stroke='url(%23g)' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body>
    <script>
      (function () {
        var theme = localStorage.getItem("kube-lens-theme");
        if (!theme) {
          theme = window.matchMedia("(prefers-color-scheme: light)").matches
            ? "vercel-light"
            : "vercel";
        }
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
    <div id="app"></div>
    <script type="module" src="/src/client.tsx"></script>
  </body>
</html>
